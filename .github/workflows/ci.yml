name: CI
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  fmt:
    name: Cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Run fmt check
        id: cargoFmt
        shell: bash
        run: cargo fmt --all -- --check

  clippy:
    name: Cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy check
        id: cargoClippy
        shell: bash
        run: RUSTFLAGS="--cfg tokio_unstable" cargo clippy --workspace --all-features -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          # MSRV history:
          # 1.86 - trait upcasts (required)
          # 1.87 - `extend_from_string`
          # 1.88 - darling 0.23
          # 1.91 - required for const TypeId::of
          - "1.91.0" # Current MSRV
          - stable
          - nightly
        flags:
          - "--all-features"
          - "--no-default-features"
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/rust-build
        with:
          toolchain: ${{ matrix.toolchain }}
          flags: ${{ matrix.flags }}

  docs-rs:
    name: Docs.rs Build Check
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/install@cargo-docs-rs
      - name: Check docs.rs build
        run: ./scripts/check-docsrs.sh

  fuzz:
    # Quick smoke test on PRs, should catch obvious regressions.
    name: Fuzz Smoke Test
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz-pr-${{ runner.os }}
          workspaces: |
            . -> target
            fuzz -> fuzz/target
      - name: Install cargo-fuzz
        uses: dtolnay/install@cargo-fuzz
      - name: Run fuzz_json
        run: cargo +nightly fuzz run fuzz_json -- -max_total_time=60
      - name: Run fuzz_emf
        run: cargo +nightly fuzz run fuzz_emf -- -max_total_time=60

  # Single aggregating check so branch protection only needs to require "CI Pass"
  # instead of naming every individual job. This job fails if any of its
  # dependencies failed or were cancelled; skipped jobs (e.g. docs-rs on release
  # branches) do not count as failures.
  value-consts:
    name: Value impl completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check all Value impls define SHAPE and UNIT
        run: RUSTFLAGS="--cfg metrique_require_explicit_impls" cargo check --workspace --all-features

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [fmt, clippy, build, docs-rs, fuzz, value-consts]
    if: always()
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi
