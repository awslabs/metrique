[package]
name = "aggregate-dep"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
metrique = { workspace = true }
metrique-aggregation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
